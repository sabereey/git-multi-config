# git-multi-config 答案文件示例 / example answer file
#
# 用法 / usage:
#   git-multi-config init --from-file examples/answers.conf --yes
#
# 说明 / notes:
#   - 目录分隔符为逗号（也可用冒号或分号）；路径中可以有空格
#   - dirs are comma separated (colon/semicolon also accepted); spaces in paths are fine
#   - 以 ~ 开头的路径会自动展开 / ~ is expanded automatically
#   - 留空的键会使用提示中的默认值 / omitted keys fall back to defaults

COMPANY_HOST=git.corp.example.com
COMPANY_KEY=~/.ssh/id_ed25519_company
COMPANY_NAME=Corp Wang
COMPANY_EMAIL=wang@corp.example.com
# 可选：GPG 签名密钥 ID（留空则不启用签名）
# optional GPG signing key id (empty disables signing)
COMPANY_GPG=
COMPANY_DIRS=~/work,~/clients

PERSONAL_HOST=github.com
PERSONAL_KEY=~/.ssh/id_ed25519
PERSONAL_NAME=Jiwei
PERSONAL_EMAIL=me@example.com
PERSONAL_GPG=
PERSONAL_DIRS=~/personal

# 受管目录之外的默认身份 / default identity outside managed dirs
DEFAULT_ID=personal

# 是否安装提交前身份拦截钩子 / install the pre-commit identity guard
INSTALL_HOOKS=0
