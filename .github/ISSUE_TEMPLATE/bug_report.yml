name: Bug report
description: Something did not work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Please redact your real email addresses, names and
        hostnames** before pasting anything below — use `dev@corp.example.com`,
        `you@example.com`, `git.corp.com` instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `git-multi-config doctor`
      description: Paste the whole output. Redact as needed.
      render: text
    validations:
      required: true

  - type: input
    id: gmc-version
    attributes:
      label: git-multi-config version
      description: "`git-multi-config --version`"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1 / Ubuntu 24.04 / WSL2
    validations:
      required: true

  - type: input
    id: bash-version
    attributes:
      label: bash version
      description: "`bash --version` — first line is enough"
      placeholder: GNU bash, version 3.2.57(1)-release (arm64-apple-darwin24)
    validations:
      required: true

  - type: input
    id: git-version
    attributes:
      label: git version
      placeholder: git version 2.23.0
    validations:
      required: true

  - type: textarea
    id: gitconfig
    attributes:
      label: Relevant part of `~/.gitconfig`
      description: Only the lines around the `# >>> git-multi-config >>>` block.
      render: ini
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Command you ran, output of `bash -x git-multi-config <cmd>` if useful.
    validations:
      required: false
