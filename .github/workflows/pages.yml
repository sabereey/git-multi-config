name: Pages

# Deploys docs/ to GitHub Pages.
#
# One-time requirement (Settings → Pages → Build and deployment):
#   Source: GitHub Actions
#
# After that, every push that touches docs/ redeploys automatically.
# You can also re-run it manually from Actions → Pages → Run workflow.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/social-preview.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          # og:image / twitter:image must be an absolute, crawlable URL
          cp assets/social-preview.png _site/social-preview.png
          echo "--- site contents ---"
          find _site -type f | sort

      # No actions/configure-pages here on purpose: enabling Pages from a
      # workflow needs admin rights the GITHUB_TOKEN does not have. Absolute
      # URLs are hardcoded in the pages, so no site metadata is needed.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
